<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, shrink-to-fit=no">
<title>Política de Libre Competencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="scorm.js"></script>

</head>


<!-- Inicio del Estilo: CSS -->
<style>
  /* Variables generales de colores, fuentes y tamaños */
  :root{
    --ink:#122036;--muted:#586a86;--line:#e0e7f1;--paper:#eef2f8;--card:#fff;
    --theme:#0093D0;--theme-soft:#e2f4fb;--good:#1f9d6b;--bad:#e0574f;--warn:#e0912f;
    --shadow:0 16px 44px -22px rgba(18,32,54,.32);--r:18px;
    --sans:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
  }

  /* Configuración general de todos los elementos */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}

  /* Contenedor principal de toda la capacitación */
  .app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

  /* Barra de progreso general de la capacitación */
  .cprog{height:4px;background:#d7e0ee;flex:0 0 auto}
  .cprog > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--theme),#7fd3ff);transition:width .5s cubic-bezier(.2,.7,.2,1)}

  /* Menú superior */
  .topmenu{display:flex;align-items:stretch;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:5}

  /* Logo y nombre de la capacitación */
  .brandmini{display:flex;align-items:center;gap:9px;padding:8px 16px;border-right:1px solid var(--line);flex:0 0 auto}
  .brandmini .m{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#1c5dd1,#1547a6);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:17px}
  .brandmini b{font-size:12.5px;line-height:1.1;color:var(--ink)}
  .brandmini small{display:block;font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}

  /* Opciones del menú superior */
  .mitems{display:flex;flex:1;min-width:0}
  .mitem{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 10px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;position:relative;border-right:1px solid var(--line);transition:color .2s,background .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mitem:last-child{border-right:none}

  /* Círculo/icono de cada elemento del menú */
  .mitem .mc{width:19px;height:19px;border-radius:50%;border:2px solid #c7d3e6;display:grid;place-items:center;flex:0 0 auto;transition:.2s}
  .mitem .mc svg{width:11px;height:11px;opacity:0;color:#fff;transition:.2s}

  /* Estado de elemento completado */
  .mitem.done .mc{background:var(--good);border-color:var(--good)}
  .mitem.done .mc svg{opacity:1}

  /* Estado del elemento actualmente seleccionado */
  .mitem.active{color:#fff}
  .mitem.active::before{content:"";position:absolute;inset:6px 6px;border-radius:9px;background:var(--am);z-index:-1}
  .mitem.active .mc{border-color:rgba(255,255,255,.8)}
  .mitem.active.done .mc{background:#fff;border-color:#fff}
  .mitem.active.done .mc svg{color:var(--am)}

  /* Estado bloqueado del menú */
  .mitem.locked{cursor:not-allowed;color:#aeb9ca}
  .mitem.locked .lock{display:inline-flex}
  .mitem .lock{display:none;color:#aeb9ca}

  /* Efecto cuando pasamos el mouse por una opción disponible */
  .mitem.nav:not(.locked):not(.active):hover{background:#f4f7fc;color:var(--ink)}

  /* Banda de color debajo del menú */
  .band{height:8px;background:linear-gradient(90deg,var(--theme),color-mix(in srgb,var(--theme) 55%,#fff));flex:0 0 auto;transition:background .35s}

  /* Área donde se muestran las escenas/diapositivas */
  .stage{flex:1 1 auto;position:relative;min-height:0}

  /* Configuración de cada escena */
  .scene{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .38s,transform .38s}
  .scene.active{opacity:1;visibility:visible;transform:none}

  /* Contenedor utilizado para ajustar el contenido al tamaño disponible */
  .fitwrap{width:100%;transform-origin:top center;will-change:transform}

  /* Panel principal de cada escena */
  .panel{margin:0 auto;width:100%;max-width:1120px;min-height:100%;display:flex;flex-direction:column;justify-content:center;transform-origin:top center;will-change:transform;padding:12px clamp(14px,2.6vw,30px) 16px;position:relative;z-index:1}

  /* Tarjetas generales */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .pad{padding:clamp(14px,2vw,24px) clamp(18px,2.4vw,34px)}

  /* Etiqueta pequeña sobre los títulos */
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--theme);background:var(--theme-soft);padding:7px 13px;border-radius:99px;margin-bottom:14px}

  /* Títulos principales */
  h1.t{font-family:var(--display);font-weight:600;font-size:clamp(27px,3.4vw,42px);line-height:1.06;margin:.08em 0;letter-spacing:-.01em}
  h2.t{font-family:var(--display);font-weight:600;font-size:clamp(23px,2.9vw,34px);line-height:1.1;margin:.05em 0}

  /* Línea decorativa debajo de títulos */
  .tbar{width:60px;height:5px;border-radius:99px;background:var(--theme);margin:10px 0 14px}

  /* Textos descriptivos */
  .lead{font-size:clamp(15.5px,1.55vw,18px);color:var(--muted);line-height:1.62;max-width:66ch}
  p.body{font-size:clamp(15px,1.5vw,17px);line-height:1.72;color:#33415c;max-width:66ch}

  /* Distribución de contenido en dos columnas */
  .split{display:grid;grid-template-columns:1.35fr .65fr;gap:clamp(16px,2.4vw,26px);align-items:Top}
  .split.rev{grid-template-columns:.95fr 1.05fr}

  /* Área de imágenes/media */
  .media{position:relative;border-radius:16px;overflow:hidden;min-height:clamp(160px,30vh,270px);background:linear-gradient(140deg,var(--theme),color-mix(in srgb,var(--theme) 40%,#0a2540));box-shadow:var(--shadow);display:flex;align-self:stretch}
  .media img{width:100%;height:100%;object-fit:cover;display:block}
  .media .phlabel{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:12px;font-weight:700;padding:16px}
  .media.noimg img{display:none}
  .media.noimg{align-items:center;justify-content:center}
  .media.noimg .phlabel{display:flex;flex-direction:column;gap:6px}
  .media.noimg .phlabel::before{content:"🖼";font-size:26px}


  /* Estilo especial de las escenas tipo portada/hero */
  .hero{background:linear-gradient(155deg,#13284b,#0c1b33);color:#fff}
  .hero .kicker{background:rgba(255,255,255,.12);color:#cfe0ff}
  .hero h1.t,.hero h2.t{color:#fff}
  .hero .lead{color:#c9d8f2}  
  .hero .media{min-height:clamp(220px,35vh,330px)} /* Ajusta el tamaño de la imagen de portada */
  .hero .split{grid-template-columns:.8fr 1.2fr} /* Aumenta el ancho de la imagen de portada */
  .hero .media.contain{background:transparent;box-shadow:none}
  .hero .media.contain img{object-fit:contain}

  /* Información adicional en forma de etiquetas */
  .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:7px 13px;border-radius:99px;font-weight:600;font-size:13.5px}
  .chip svg{width:15px;height:15px;color:#7fd3ff}

  /* Listas secuenciales */
  .seq{display:grid;gap:13px}
  .obj{display:flex;gap:13px;align-items:flex-start;opacity:0;transform:translateX(-8px);transition:.5s;padding:2px 0}
  .obj.in{opacity:1;transform:none}
  .obj .ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--theme-soft);color:var(--theme);display:grid;place-items:center;margin-top:1px}
  .obj .ic svg{width:16px;height:16px}
  .obj p{margin:0;font-size:clamp(15px,1.5vw,17px);line-height:1.55}
  .obj p strong{color:var(--ink);font-weight:800}

  /* Tarjetas interactivas de los pilares */
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pill{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:clamp(200px,32vh,290px);cursor:pointer;box-shadow:var(--shadow);background:#0c1b33}
  .pill .pf{position:absolute;inset:0;transition:opacity .5s}
  .pill .pf img{width:100%;height:100%;object-fit:cover}
  .pill .pf .lab{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 18px;background:linear-gradient(transparent,rgba(6,16,33,.35),rgba(6,16,33,.9));color:#fff;font-weight:800;font-size:clamp(16px,1.8vw,20px);display:flex;align-items:center;gap:9px}
  .pill .pf .hintclick{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);color:#13284b;font-size:11px;font-weight:800;padding:6px 10px;border-radius:99px}
  .pill .pb{position:absolute;inset:0;padding:clamp(18px,2.4vw,26px);background:var(--card);opacity:0;visibility:hidden;transition:opacity .5s;display:flex;flex-direction:column;justify-content:center}
  .pill.open .pf{opacity:0;visibility:hidden}
  .pill.open .pb{opacity:1;visibility:visible}
  .pill .pb .badge{width:44px;height:44px;border-radius:12px;background:var(--theme);color:#fff;display:grid;place-items:center;margin-bottom:12px}
  .pill .pb h3{margin:0 0 8px;font-size:clamp(17px,1.9vw,21px)}
  .pill .pb p{margin:0;font-size:clamp(14px,1.45vw,16px);line-height:1.55;color:#41506b}
  .pill .pb .re{margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .pill .dtick{position:absolute;top:12px;left:12px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:none;place-items:center;z-index:3}
  .pill.done .dtick{display:grid}
  .pill .dtick svg{width:14px;height:14px}

  /* Acordeones de preguntas y respuestas */
  .acc{display:grid;gap:8px}
  .qrow{border:1px solid var(--line);border-radius:13px;background:var(--card);overflow:hidden}
  .qrow .head{display:flex;align-items:center;gap:13px;padding:11px 16px;cursor:pointer;font-weight:700;font-size:clamp(14px,1.5vw,16px)}
  .qrow .head .q{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--theme-soft);color:var(--theme);display:grid;place-items:center;font-size:13px;font-weight:800}
  .qrow .head .chev{margin-left:auto;color:var(--muted);transition:transform .3s}
  .qrow .body{max-height:0;overflow:hidden;transition:max-height .4s;background:#fbfdff}
  .qrow .body .inner{padding:2px 16px 12px 56px;font-size:clamp(13.5px,1.45vw,15.5px);color:#41506b;line-height:1.6}
  .qrow.open{border-color:var(--theme)}
  .qrow.open .head .q{background:var(--theme);color:#fff}
  .qrow.open .head .chev{transform:rotate(180deg)}
  .qrow.open .body{max-height:460px}

  /* Botones de preguntas */
  .qlist{display:grid;gap:12px}
  .qbtn{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:13px;padding:13px 16px;cursor:pointer;font-weight:700;font-size:clamp(14.5px,1.55vw,16.5px);background:#fff;transition:.16s;text-align:left;width:100%}
  .qbtn:hover{border-color:var(--theme);background:#f8fbff;transform:translateX(3px)}
  .qbtn .qi{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--theme-soft);color:var(--theme);display:grid;place-items:center;font-weight:800;font-size:14px}
  .qbtn .qck{margin-left:auto;width:21px;height:21px;border-radius:50%;border:1.5px solid #c7d3e6;display:grid;place-items:center;flex:0 0 auto}
  .qbtn.seen .qck{background:var(--good);border-color:var(--good)}
  .qbtn .qck svg{width:12px;height:12px;color:#fff;opacity:0}
  .qbtn.seen .qck svg{opacity:1}
  .qbtn .chev2{color:var(--muted)}

  /* Detalle que aparece al seleccionar una pregunta */
  .qdetail{display:none}
  .qdetail.on{display:block;animation:slideUp .4s ease}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .qback{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:700;font-size:13.5px;border-radius:9px;padding:9px 14px;cursor:pointer}
  .qbackwrap{display:flex;justify-content:flex-end;margin-top:16px}
  .qback:hover{border-color:var(--theme);color:var(--ink)}
  .qdetail .qtitle{display:flex;align-items:center;gap:13px;font-family:var(--display);font-weight:600;font-size:clamp(19px,2.3vw,26px);color:var(--ink);padding:15px 17px;background:var(--theme-soft);border-radius:13px;margin-bottom:18px}
  .qdetail .qtitle .qi{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--theme);color:#fff;display:grid;place-items:center;font-weight:800}

  /* Listas tipo checklist */
  .checklist{display:grid;gap:12px}
  .checklist .ci{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;opacity:0;transform:translateX(-8px);animation:ciIn .45s forwards}
  .checklist .ci .ck{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
  .checklist .ci .ck svg{width:16px;height:16px}
  .checklist .ci p{margin:0;font-size:clamp(15px,1.55vw,17px);line-height:1.5}
  @keyframes ciIn{to{opacity:1;transform:none}}

  /* Diseño de contenido con lista lateral y contenido principal */
  .vmaster{display:grid;grid-template-columns:0.7fr 1.3fr;gap:clamp(18px,2.6vw,26px);align-items:start}

  /* Bloquea elementos interactivos durante una introducción */
  .scene.introlock .pill,.scene.introlock .qbtn,.scene.introlock .vbtn,.scene.introlock .qrow .head,.scene.introlock .helpcard,.scene.introlock .opt,.scene.introlock [data-submit],.scene.introlock .hubcard{pointer-events:none;opacity:.5;filter:grayscale(.25);cursor:default}

  /* Contenido principal de módulos de video */
  .vcontent{border:1px solid var(--line);border-radius:16px;background:#fbfdff;padding:clamp(20px,2.6vw,28px);min-height:clamp(240px,40vh,300px)}
  .vcontent .vph{color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:12px}
  .vcontent .vph .vphic{width:56px;height:56px;border-radius:15px;background:var(--theme);color:#fff;display:grid;place-items:center}
  .vcontent h3{margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:clamp(20px,2.3vw,25px);color:var(--ink);display:flex;align-items:center;gap:11px}
  .vcontent h3 .vi{width:38px;height:38px;border-radius:10px;background:var(--theme);color:#fff;display:grid;place-items:center;flex:0 0 auto}
  .vcontent p{margin:0 0 11px;font-size:clamp(14.5px,1.5vw,16.5px);line-height:1.62;color:#33415c}
  .vcontent.fade{animation:fadeIn .35s}
  @keyframes fadeIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}

  /* Lista de opciones de contenido */
  .vlist{display:grid;gap:12px}
  .vbtn{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;font-weight:700;font-size:clamp(14.5px,1.55vw,16.5px);background:#fff;transition:.18s;text-align:left}
  .vbtn:hover{border-color:var(--theme);transform:translateX(-4px)}
  .vbtn.active{border-color:var(--theme);background:var(--theme-soft);transform:translateX(-8px);box-shadow:var(--shadow)}
  .vbtn .vic{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--theme-soft);color:var(--theme);display:grid;place-items:center}
  .vbtn.active .vic{background:var(--theme);color:#fff}
  .vbtn .vck{margin-left:auto;width:21px;height:21px;border-radius:50%;border:1.5px solid #c7d3e6;display:grid;place-items:center;flex:0 0 auto}
  .vbtn.seen .vck{background:var(--good);border-color:var(--good)}
  .vbtn .vck svg{width:12px;height:12px;color:#fff;opacity:0}
  .vbtn.seen .vck svg{opacity:1}

  /* Tarjetas del menú interno */
  .hubgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .hubcard{border:1.5px solid var(--line);border-radius:15px;background:#fff;cursor:pointer;padding:17px 18px;display:flex;align-items:center;gap:15px;transition:.18s;position:relative;text-align:left}
  .hubcard:hover{border-color:var(--theme);transform:translateY(-2px);box-shadow:var(--shadow)}
  .hubcard .hic{flex:0 0 auto;width:48px;height:48px;border-radius:13px;background:var(--theme);color:#fff;display:grid;place-items:center}
  .hubcard h3{margin:0 0 3px;font-size:clamp(15px,1.6vw,17px)}
  .hubcard p{margin:0;font-size:clamp(12.5px,1.35vw,14px);color:var(--muted);line-height:1.4}
  .hubcard .hgo{margin-left:auto;color:var(--theme);flex:0 0 auto;transition:transform .2s}
  .hubcard:hover .hgo{transform:translateX(3px)}
  .hubcard .hck{position:absolute;top:11px;right:11px;width:23px;height:23px;border-radius:50%;background:var(--good);color:#fff;display:none;place-items:center}
  .hubcard.done .hck{display:grid}
  .hubcard.done .hgo{display:none}
  .hubcard .hck svg{width:13px;height:13px}
  .hubcard.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:#f4fbf7}
  .hubnote{margin-top:18px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .hubnote b{color:var(--ink)}

  /* Diagrama de ciclo */
  .cycle{position:relative;margin:4px auto 0;max-width:660px}
  .cycle svg{width:100%;height:auto;display:block;overflow:visible}
  .cnode{opacity:0;transition:opacity .55s}
  .cnode.in{opacity:1}
  .carrow{opacity:0;stroke-dasharray:560;stroke-dashoffset:560;transition:opacity .3s,stroke-dashoffset 1s ease}
  .carrow.in{opacity:1;stroke-dashoffset:0}
  .cyc-cap{font-size:13.5px;color:#33415c;line-height:1.45}
  .cyc-cap b{color:var(--ink)}

  /* Escenarios y preguntas */
  .scnbox{border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .scnhead{background:var(--theme);color:#fff;padding:12px 18px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
  .scnhead svg{width:17px;height:17px}
  .scngrid{display:grid;grid-template-columns:1fr 1fr}
  .scngrid .sit{padding:18px 20px;font-size:clamp(14.5px,1.5vw,16.5px);line-height:1.58;color:#33415c;border-right:1px solid var(--line)}
  .scngrid .ans{padding:16px 20px}
  .scngrid .qn{font-weight:800;font-size:clamp(15px,1.55vw,17px);margin-bottom:12px}

  /* Opciones de respuesta */
  .opts{display:grid;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;font-size:clamp(14px,1.5vw,15.5px);transition:.15s;background:#fff}
  .opt:hover{border-color:color-mix(in srgb,var(--theme) 45%,var(--line));background:#f8fbff}
  .opt .k{flex:0 0 auto;width:25px;height:25px;border-radius:50%;border:1.5px solid #c3d3ec;font-weight:800;font-size:12.5px;display:grid;place-items:center;color:var(--muted)}
  .opt.sel{border-color:var(--theme);background:var(--theme-soft)}
  .opt.sel .k{background:var(--theme);color:#fff;border-color:var(--theme)}
  .opt.correct{border-color:var(--good);background:#effaf4}
  .opt.correct .k{background:var(--good);border-color:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:#fdf1f0}
  .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.locked{pointer-events:none}

  /* Mensaje de resultado de la pregunta */
  .fbstatus{margin-top:14px;display:none;align-items:center;gap:8px;font-weight:700;font-size:clamp(14px,1.5vw,16px)}
  .fbstatus.show{display:flex}
  .fbstatus.ok{color:var(--good)}
  .fbstatus.no{color:var(--bad)}
  .fbstatus .fsi{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .fbstatus.ok .fsi{background:var(--good)}
  .fbstatus.no .fsi{background:var(--bad)}
  .fbstatus .fsi svg{width:13px;height:13px}

  /* Caja con explicación después de responder */
  .fb{margin-top:14px;border-radius:13px;padding:15px 16px;display:none;font-size:clamp(14px,1.5vw,16px);line-height:1.55;gap:13px;align-items:flex-start}
  .fb.show{display:flex}
  .fb.ok{background:#effaf4;border:1px solid #bde9d1;color:#1a6b48}
  .fb.no{background:#fdf1f0;border:1px solid #f2c3bf;color:#a23a32}
  .fb .fbi{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .fb.ok .fbi{background:var(--good)}
  .fb.no .fbi{background:var(--bad)}
  .fb .fbi svg{width:22px;height:22px}
  .fb b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.05em;text-transform:uppercase}

  /* Tarjetas de ayuda */
  .helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .helpcard{border:1.5px solid var(--line);border-radius:15px;background:#fff;padding:0;overflow:hidden;cursor:pointer;transition:.18s;position:relative}
  .helpcard:hover{border-color:var(--theme);box-shadow:var(--shadow)}
  .helpcard .hh{display:flex;align-items:center;gap:12px;padding:15px 17px;font-weight:800;font-size:clamp(15px,1.6vw,17px);background:var(--theme);color:#fff}
  .helpcard .hh .hhi{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 auto}
  .helpcard .hbody{max-height:0;overflow:hidden;transition:max-height .45s}
  .helpcard.open .hbody{max-height:360px}
  .helpcard .hin{padding:15px 18px}
  .helpcard .hin ul{margin:0;padding-left:20px;display:grid;gap:8px}
  .helpcard .hin li{font-size:clamp(14px,1.45vw,15.5px);line-height:1.5;color:#41506b}
  .helpcard .hh .hhck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6);display:grid;place-items:center}
  .helpcard.open .hh .hhck{background:#fff}
  .helpcard .hh .hhck svg{width:12px;height:12px;color:var(--theme);opacity:0}
  .helpcard.open .hh .hhck svg{opacity:1}
  .helpteaser{font-size:12px;color:var(--muted);font-weight:700;padding:12px 18px}
  .helpcard.open .helpteaser{display:none}

  /* Bloque de consecuencias */
  .conseq{display:grid;gap:14px}
  .conrow{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:18px 20px;background:#fff;opacity:0;transform:translateY(12px);transition:.5s}
  .conrow.in{opacity:1;transform:none}
  .conrow .cic{flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .conrow.warn .cic{background:var(--warn)}
  .conrow.stop .cic{background:var(--bad)}
  .conrow .cic svg{width:30px;height:30px}
  .conrow p{margin:0;font-size:clamp(14.5px,1.5vw,16.5px);line-height:1.55;color:#33415c}

  /* Sección de compromiso final */
  .commit-intro{font-size:clamp(16px,1.7vw,19px);font-weight:800;color:var(--ink);line-height:1.4;margin-bottom:18px}
  .commit-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .commit-card{display:flex;gap:15px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:16px;background:#fbfdff}
  .commit-card .cim{flex:0 0 auto;width:88px;height:88px;border-radius:12px;overflow:hidden;background:var(--theme-soft)}
  .commit-card .cim img{width:100%;height:100%;object-fit:cover}
  .commit-card p{margin:0;font-size:clamp(14px,1.45vw,16px);line-height:1.55;color:#41506b}
  .commit-thanks{margin-top:20px;text-align:center;font-family:var(--display);font-weight:600;font-size:clamp(18px,2vw,24px);color:var(--theme)}

  /* Sección de recursos y certificado */
  .resgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:center}
  .reslist{display:grid;gap:11px}
  .reslink{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:12px;padding:15px 16px;text-decoration:none;color:var(--ink);font-weight:700;font-size:clamp(14px,1.5vw,16px);transition:.15s;background:#fff}
  .reslink:hover{border-color:var(--theme);background:#f8fbff}
  .reslink .ic{width:36px;height:36px;border-radius:10px;background:var(--theme-soft);color:var(--theme);display:grid;place-items:center;flex:0 0 auto}
  .reslink .ic svg{width:18px;height:18px}
  .reslink small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
  .reslink .go{margin-left:auto;color:var(--muted)}
  .certcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;border:1px dashed color-mix(in srgb,var(--theme) 50%,var(--line));border-radius:16px;padding:22px;background:var(--theme-soft)}
  .certcard img{width:92px;height:92px;object-fit:contain}

  /* Botones generales */
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;border-radius:12px;padding:12px 22px;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,box-shadow .2s,opacity .2s}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--theme);color:#fff;box-shadow:0 10px 22px -12px var(--theme)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.good{background:var(--good);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:#bcd0ea}
  .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

  /* Barra inferior completa */
  .bottom{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);z-index:6}

  /* Transcripción del audio */
  .transcript{display:none;padding:11px clamp(14px,3vw,26px) 0;font-size:clamp(13px,1.4vw,15px);line-height:1.55;color:#33415c;max-height:78px;overflow:auto}
  .transcript.on{display:block}
  .transcript .w{transition:background .1s,color .1s;border-radius:3px;padding:0 1px}
  .transcript .w.act{background:var(--theme);color:#fff}
  .transcript .lbl{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

  /* Reproductor de audio */
  .player{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,26px)}
  .pbtn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:var(--theme);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--theme);transition:transform .12s}
  .pbtn:hover{transform:scale(1.06)}
  .pbtn svg{width:19px;height:19px}
  .pbtn[disabled]{opacity:.5;cursor:wait;box-shadow:none;transform:none}

  /* Indicador de primera reproducción */
  .lockbadge{display:none;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:700;flex:0 0 auto}
  .lockbadge.show{display:inline-flex}
  .lockbadge svg{width:14px;height:14px}

  /* Tiempo y barra de avance del audio */
  .time{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--muted);min-width:34px;text-align:center}
  .seek{flex:1;height:7px;border-radius:99px;background:#dde6f3;position:relative;cursor:pointer;min-width:70px}
  .seek > i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:var(--theme)}
  .seek .knob{position:absolute;top:50%;left:0;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--theme);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .seek.locked{cursor:not-allowed;opacity:.7}
  .seek.locked .knob{border-color:#9fb0c9}
  .seek.locked > i{background:#9fb0c9}

  /* Control de volumen */
  .vol-wrap{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .vbtn{background:none;border:none;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:2px}
  .vbtn svg{width:19px;height:19px}
  .vol{width:76px;accent-color:var(--theme);cursor:pointer}

  /* Botón de subtítulos CC */
  .ccbtn{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:11px;border-radius:8px;padding:8px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .ccbtn.on{background:var(--theme);border-color:var(--theme);color:#fff}
  .ccbtn svg{width:15px;height:15px}

  /* Fila de navegación inferior */
  .navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(14px,3vw,26px) 12px}
  .navrow .left{font-size:12px;color:var(--muted);font-weight:700}
  .hint{font-size:12px;color:#c9820b;font-weight:800;display:none;align-items:center;gap:6px}
  .hint.show{display:inline-flex}
  .hint svg{width:14px;height:14px}

  /* Adaptación para pantallas pequeñas/tablets */
  @media (max-width:880px){
    .brandmini{display:none}
    .mitem{font-size:0;gap:0;padding:12px 6px}
    .mitem .lbltxt{display:none}
    .mitem .mabbr{display:inline;font-size:13px}
    .split,.split.rev,.pillars,.scngrid,.vmaster,.hubgrid,.helpgrid,.commit-grid,.resgrid{grid-template-columns:1fr}
    .scngrid .sit{border-right:none;border-bottom:1px solid var(--line)}
    .media{min-height:180px}
    .vol{width:56px}
    .player{gap:8px;flex-wrap:wrap}
    .commit-card .cim{width:64px;height:64px}
  }

  /* Abreviaturas del menú: ocultas en escritorio */
  .mabbr{display:none}

  /* Desactiva animaciones si el usuario prefiere menos movimiento */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<!-- Fin del Estilo: CSS -->

</head>
<body>
<div class="app"> <!-- Contenedor Principal -->

    <div class="mitems" id="mitems"></div> <!-- Menú generado por JavaScript -->
  </div>
  <div class="band" id="band"></div> <!-- Banda de color de la sección -->
  <div class="stage" id="stage"></div> <!-- Contenido principal generado por JavaScript -->
  <div class="bottom"> <!-- Controles inferiores -->
    <div class="transcript" id="transcript"><span class="lbl">Transcripción</span><span id="transcriptText"></span></div> <!-- Transcripción -->
    <div class="player"> <!-- Reproductor de audio -->
      <button class="pbtn" id="playBtn" aria-label="Reproducir" disabled></button> <!-- Botón reproducir -->
      <span class="lockbadge" id="lockBadge" title="La primera vez debes escuchar el audio completo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>1ª vez</span> <!-- Indicador de primera escucha -->
      <span class="time" id="tCur">0:00</span> <!-- Tiempo actual -->
      <div class="seek" id="seek"><i id="seekFill"></i><span class="knob" id="knob"></span></div> <!-- Barra de progreso del audio -->
      <span class="time" id="tTot">0:00</span> <!-- Duración total -->
      <div class="vol-wrap"><button class="vbtn" id="volBtn" aria-label="Volumen"></button><input type="range" class="vol" id="vol" min="0" max="100" value="100"></div> <!-- Control de volumen -->
      <button class="ccbtn" id="ccBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M8 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg> CC</button> <!-- Subtítulos -->

        <button class="btn ghost" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg> Anterior</button> <!-- Botón anterior -->
        <button class="btn primary" id="nextBtn">Siguiente <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></button> <!-- Botón siguiente -->
      </div>
    </div>
  </div>
</div>


<script>
"use strict";

// ============================================================
// CONFIGURACIÓN GENERAL
// ============================================================

var TH={
  gen:{c:"#5b6b85",s:"#eef2f8"},
  intro:{c:"#0093D0",s:"#e2f4fb"},
  cod:{c:"#5FA83D",s:"#eef7e6"},
  cierre:{c:"#7B3F8F",s:"#f3ebf6"}
};

// ============================================================
// MENÚ PRINCIPAL
// Define las opciones que aparecerán en el menú superior.
// key  = identificador de la sección
// mod  = módulo al que pertenece
// full = nombre completo
// abbr = abreviatura que puede mostrarse en pantallas pequeñas
// ============================================================
var MENU=[
  {key:"toc",mod:"gen",full:"Inicio",abbr:"IN"},
  {key:"intro",mod:"intro",full:"Libre Competencia",abbr:"LC"},
  {key:"cod",mod:"cod",full:"Conductas",abbr:"CO"},
  {key:"cierre",mod:"cierre",full:"Cierre",abbr:"CI"}
];

// ============================================================
// SECCIONES DE CADA MÓDULO
// Relaciona cada módulo con sus identificadores de sección.
// ============================================================
var MODSECS={
  intro:["b1"],
  cod:["b2"],
  cierre:["b3"]
};

// ============================================================
// CONTENIDO DE ÉTICA
// Lista de temas relacionados con ética.
// Cada elemento contiene:
// [0] = título
// [1] = descripción
// ============================================================
var ETICA=[
  ["Antisoborno y anticorrupción","No ofrecer, entregar, solicitar ni aceptar sobornos o cualquier beneficio indebido."],
  ["Competencia leal","Competir de manera justa y no participar en prácticas comerciales ilegales."],
  ["Bienestar animal","Cuando sea necesario utilizar animales, deberán ser tratados con respeto, minimizando el dolor y el estrés."],
  ["Privacidad","Proteger la información confidencial de Roche, de sus colaboradores y de sus pacientes."],
  ["Prevención de conflictos de interés","Identificar, prevenir y gestionar los conflictos de interés e informar a Roche cuando exista un conflicto real o potencial."],
  ["Protección del producto","Contar con sistemas para proteger los productos, componentes e ingredientes contra robo, falsificación y adulteración."]
];

// ============================================================
// CONTENIDO DE DERECHOS HUMANOS
// Contiene los temas y explicaciones relacionados con DDHH.
// ============================================================
var DDHH=[
  ["Empleo de libre elección","Garantizar que todo trabajo sea voluntario y que los trabajadores no paguen por obtener un empleo. No utilizar trabajo forzoso, trabajo por servidumbre ni ninguna forma de esclavitud moderna."],
  ["Trabajo infantil y trabajadores jóvenes","No utilizar trabajo infantil. La contratación de trabajadores jóvenes (menores de 18 años) solo está permitida para trabajos seguros y no peligrosos, siempre que hayan alcanzado la edad mínima legal para trabajar o hayan concluido la educación obligatoria."],
  ["No discriminación","Tratar a todos los trabajadores de manera justa y proporcionar un ambiente de trabajo libre de discriminación."],
  ["Trato justo","Garantizar que el ambiente de trabajo esté libre de acoso, trato severo e inhumano."],
  ["Salarios, beneficios y horas de trabajo","Pagar a los trabajadores de manera justa, incluyendo el salario mínimo, las horas extras, los beneficios y los pagos oportunos."],
  ["Libertad de asociación y negociación colectiva","Respetar el derecho de los trabajadores a afiliarse a un sindicato y a negociar colectivamente."],
  ["Comunidades locales e indígenas","Respetar los derechos de las comunidades locales, incluido el derecho a un ambiente limpio y saludable."],
  ["Abastecimiento responsable de minerales y metales","Utilizar e importar únicamente minerales y metales provenientes de fuentes responsables."]
];

// ============================================================
// CONTENIDO DE MEDIO AMBIENTE
// Contiene los temas relacionados con gestión ambiental.
// ============================================================
var MAMB=[
  ["Cumplimiento ambiental","Cumplir toda la legislación ambiental aplicable y obtener los permisos y licencias necesarios."],
  ["Gestión de residuos y emisiones","Gestionar, controlar y tratar adecuadamente los residuos, las aguas residuales y las emisiones para prevenir daños al medio ambiente."],
  ["Cambio climático","Evaluar y reportar sus emisiones de gases de efecto invernadero y establecer metas de reducción de emisiones alineadas con la trayectoria de 1,5 °C (conforme al Acuerdo de París). Asimismo, fijar metas para reducir los residuos y el consumo de energía, y esforzarse por una transición hacia fuentes de energía renovable."],
  ["Eficiencia en el uso de recursos","Reducir el consumo de recursos como el agua y la energía, reutilizando y reciclando materiales para una economía más circular."],
  ["Conservación de la biodiversidad","Conservar la biodiversidad mediante el uso responsable de los recursos naturales y el cumplimiento de la normativa ambiental, asegurando que las operaciones no contribuyan a la deforestación."],
  ["Prevención de derrames y liberaciones","Contar con sistemas eficaces para prevenir, controlar, mitigar y comunicar derrames o liberaciones accidentales al medio ambiente."],
  ["Materiales peligrosos","Evitar el uso de sustancias prohibidas y eliminar progresivamente, de manera activa, las sustancias altamente preocupantes (SVHC) y las sustancias perfluoroalquiladas y polifluoroalquiladas (PFAS). Ayudar a Roche proporcionando declaraciones precisas y conformes."]
];

// ============================================================
// FUNCIÓN PARA CONVERTIR LISTAS EN OBJETOS
// Recibe una lista y una base.
// Devuelve objetos con:
// q = pregunta/título
// a = respuesta/descripción
// k = identificador generado
// ============================================================
function accFrom(a,base){
  return a.map(function(t,i){
    return {
      q:t[0],
      a:t[1],
      k:base+'-'+(i+1)
    };
  });
}

// ============================================================
// TEXTOS DE AUDIO / NARRACIÓN
// A contiene todos los textos que serán utilizados en las
// diferentes escenas de la capacitación.
// ============================================================
var A={

  // Audio de bienvenida
  bienvenida:"Bienvenido a la capacitación sobre la Política de Libre Competencia de la Empresa. En los próximos minutos conoceremos qué significa competir correctamente, cuáles son las principales conductas que debemos evitar y cómo debemos actuar frente a situaciones que puedan generar un riesgo para la empresa. Cuando estés listo, inicia la capacitación.",

  // Audio de instrucciones
  comoRealizar:"Antes de comenzar, conoce cómo realizar esta capacitación sobre libre competencia. Revisa las diapositivas en orden y escucha las explicaciones. Encontrarás cuatro casos prácticos relacionados con situaciones que pueden presentarse en tu trabajo. En cada caso, selecciona una respuesta y, después de enviarla, revisa la explicación antes de continuar.",

  // Textos del bloque 1
  b1QueEs:"La libre competencia significa que cada empresa decide por sí misma cómo competir. Esto permite que los clientes puedan elegir entre diferentes alternativas y motiva a las empresas a mejorar sus precios, la calidad de sus productos y servicios, y a buscar nuevas formas de diferenciarse.",
  b1PorQue:"La libre competencia beneficia a los clientes, a las empresas y al mercado en general. Cuando las empresas compiten correctamente, cada una busca mejorar por sus propios medios. El problema aparece cuando dos o más empresas dejan de competir y empiezan a ponerse de acuerdo para controlar precios, repartirse clientes o decidir quién participará en una oportunidad comercial.",
  b1Peru:"En el Perú, la libre competencia está protegida por la Constitución. El Estado debe vigilar que las empresas compitan correctamente y combatir las prácticas que puedan limitar la competencia. El Indecopi es la principal autoridad encargada de investigar y sancionar este tipo de conductas dentro de sus competencias.",
  b1Principios:"Para competir correctamente debemos recordar cuatro principios. Primero, independencia: nuestras decisiones comerciales deben ser adoptadas por la Empresa sin coordinarlas con competidores. Segundo, no coordinación: no acordamos con competidores precios, clientes, mercados ni participación en procesos. Tercero, confidencialidad: protegemos nuestra información comercial sensible. Y cuarto, prevención y consulta: si una conversación, propuesta o solicitud genera dudas, no continuamos con una posible coordinación ni proporcionamos información sensible, y comunicamos de inmediato la situación a nuestro jefe inmediato y al responsable de cumplimiento.",

  // Textos del bloque 2
  b2Conductas:"Las conductas anticompetitivas son acciones o acuerdos que pueden limitar o perjudicar la competencia en el mercado. Pueden presentarse de distintas maneras. Por ejemplo, cuando una empresa utiliza indebidamente una posición fuerte para perjudicar la competencia; cuando competidores acuerdan sus precios; cuando se reparten clientes, productos o zonas; cuando acuerdan limitar las cantidades que ofrecerán; o cuando coordinan quién participará o será favorecido en una oportunidad comercial. Estas reglas se aplican a nuestra actividad en general, tanto en operaciones con entidades públicas como en negocios y ventas con clientes privados.",
  b2Abuso:"Una empresa puede ser grande, tener muchos clientes o vender más que otras sin cometer ninguna infracción. El problema aparece cuando utiliza ese poder para hacerle difícil competir a otras empresas de manera injusta. Por ejemplo, si presiona a sus clientes para que no compren productos de otra marca, si les ofrece una ventaja únicamente a cambio de dejar de comprarle a la competencia o si coloca trabas para impedir que nuevas empresas ingresen al mercado. Lo importante es entender que tener una posición fuerte no está prohibido; lo que se sanciona es usarla de manera abusiva para perjudicar la competencia.",
  b2Concertacion:"La concertación de precios ocurre cuando empresas que deberían competir entre sí acuerdan cuánto cobrar, cuánto descontar o qué condiciones comerciales ofrecer. No es necesario firmar un documento. Una coordinación puede realizarse mediante una conversación, una llamada, un mensaje o un correo electrónico.",

  casoIntro:"Lee el escenario y responde qué harías frente a esta situación.",

  return String(s)

    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;');
}

// ============================================================
// SISTEMA GENERAL DE INTERACCIONES
// ============================================================

// Ejecuta la función de interacción propia de la diapositiva.
function wire(scene,i){
  if(scene.dataset.wired)return;
  scene.dataset.wired="1";
  var s=SLIDES[i];
  if(s.wire)s.wire(scene,i);
}

// Devuelve el primer audio pendiente.
function nextUnheard(keys){
  for(var k=0;k<keys.length;k++){
    if(!heard[keys[k]])return k;
  }
  return -1;
}

// Obtiene el audio de una diapositiva.
function audioKeys(i){
  var s=SLIDES[i];
  return s.audio?[s.k]:[];
}

// Comprueba si el audio de una diapositiva fue escuchado.
function audiosHeard(i){
  return audioKeys(i).every(function(k){return heard[k];});
}

// Completa una diapositiva cuando está lista.
function tryComplete(i){
  if(i==null||i<0)return;
  if(!slideDone[i]&&isReady(i))markSlide(i);
  else if(i===idx)refreshNav();
}

// ============================================================
// ANIMACIÓN DE LISTAS
// ============================================================

// Revela los elementos de una lista uno por uno.
function runSequence(scene,i){
  var s=SLIDES[i];
  var items=scene.querySelectorAll("[data-seq] > *");

  items.forEach(function(el){el.classList.remove("in");});

  items.forEach(function(el,k){
    setTimeout(function(){
      if(scenes[idx]===scene)el.classList.add("in");
    },300+k*600);
  });
/*
  setTimeout(function(){
    if(idx===i&&audioUnlocked&&s.audio&&!heard[s.k])play();
  },300+items.length*600+150);
  */
}

// ============================================================
// COMPLETADO Y PROGRESO
// ============================================================

// Marca una diapositiva como completada.
function markSlide(i){
  slideDone[i]=true;
  var s=SLIDES[i];

  if(s.sec&&lastSlideOfSec[s.sec]===i)secDone[s.sec]=true;

  Object.keys(MODSECS).forEach(function(k){
    if(MODSECS[k].every(function(x){return secDone[x];}))modDone[k]=true;
  });

  if(i===idx)refreshNav();
  refreshMenu();
  refreshTOC();
  updateOverall();
}

// Actualiza la barra de progreso.
function updateOverall(){
  var pct=Math.round(slideDone.filter(Boolean).length/SLIDES.length*100);
  document.getElementById("cprogFill").style.width=pct+"%";
  if(window.SCORM)SCORM.setProgress(pct);
}

// ============================================================
// MENÚ
// ============================================================

// Construye el menú superior.
function buildMenu(){
  var c=document.getElementById("mitems");
  c.innerHTML="";

  MENU.forEach(function(m){
    var d=document.createElement("div");

    d.className="mitem nav";
    d.dataset.key=m.key;
    d.dataset.mod=m.mod;
    d.style.setProperty("--am",TH[m.mod].c);

    d.innerHTML='<span class="mc">'+svg("check",11)+'</span><span class="lbltxt">'+m.full+'</span><span class="mabbr">'+m.abbr+'</span><span class="lock">'+svg("lock",13)+'</span>';

    d.addEventListener("click",function(){
      var t=navTarget[m.key];
      if(t===undefined)return;
      if(!RESTRICT||t<=maxReached)show(t);
    });

    c.appendChild(d);
  });
}

// Actualiza el estado visual del menú.
function refreshMenu(){
  var cur=SLIDES[idx].menu;

  document.querySelectorAll(".mitem").forEach(function(d){
    var k=d.dataset.key,t=navTarget[k];

    d.classList.toggle("active",k===cur);

    var done=
      (k==="intro"&&modDone.intro)||
      (k==="cod"&&modDone.cod)||
      (k==="cierre"&&modDone.cierre)||
      (k==="toc"&&slideDone[0]&&slideDone[1]&&slideDone[2]);

    d.classList.toggle("done",!!done);
    d.classList.toggle("locked",RESTRICT&&!(t<=maxReached));
  });
}

// Aplica el tema de color de la diapositiva.
function applyTheme(mod){
  var t=TH[mod]||TH.gen;
  var r=document.documentElement.style;
  r.setProperty("--theme",t.c);
  r.setProperty("--theme-soft",t.s);
  document.getElementById("band").style.background="linear-gradient(90deg,"+t.c+","+t.c+"88)";
}

// ============================================================
// NAVEGACIÓN
// ============================================================

// Obtiene el tipo de bloqueo de una diapositiva.
function gateType(i){return SLIDES[i].gate||"0";}

// Comprueba si se puede avanzar.
function isReady(i){
  if(!RESTRICT)return true;
  return audiosHeard(i);
}

// Calcula la siguiente diapositiva.
function nextIndex(cur){
  var n=cur+1;
  return n<SLIDES.length?n:-1;
}

// Calcula la diapositiva anterior.
function prevIndex(cur){
  return cur>0?cur-1:-1;
}

// ============================================================
// AJUSTE DE CONTENIDO
// ============================================================

var _RO=(window.ResizeObserver)?new ResizeObserver(function(){fitScene();}):null;

// Ajusta la escena al espacio disponible.
function fitScene(sc){
  sc=sc||scenes[idx];
  if(!sc)return;
  var p=sc.querySelector(".fitwrap");
  if(!p)return;
  p.style.transform="none";
  var avail=sc.clientHeight,need=p.scrollHeight;
  if(avail>0&&need>avail+1){
    var f=Math.max(.5,avail/need);
    p.style.transform="scale("+f+")";
  }
}

// Arranca el audio de la diapositiva i SOLO si no está sonando y no se ha escuchado. Nunca alterna/pausa.
function autoPlay(i){
  if(i!==idx)return;
  var s=SLIDES[i];
  if(!audioUnlocked||!s.audio||P.playing||heard[s.k])return;
  play();
}

// Revela las viñetas [data-seq] una por una y, al terminar, reproduce el audio.
function revealSeq(scene,i,per){
  per=per||800;
  var items=scene.querySelectorAll("[data-seq] > *");
  items.forEach(function(el){el.classList.remove("in");});
  items.forEach(function(el,k){
    setTimeout(function(){
      if(scenes[idx]===scene){el.classList.add("in");fitScene(scene);}
    },250+k*per);
  });
  setTimeout(function(){autoPlay(i);},250+items.length*per+200);
}

// Revela el ciclo (Aprende/Analiza/Decide) y, al terminar, reproduce el audio.
function revealCycle(scene,i,per){
  per=per||1000;
  var orden=[["cn-aprende"],["ca-1","cn-analiza"],["ca-2","cn-decide"],["ca-3"]];
  scene.querySelectorAll(".cnode,.carrow").forEach(function(e){e.classList.remove("in");});
  orden.forEach(function(ids,k){
    setTimeout(function(){
      if(scenes[idx]!==scene)return;
      ids.forEach(function(id){var e=scene.querySelector("#"+id);if(e)e.classList.add("in");});
      fitScene(scene);
    },400+k*per);
  });
  setTimeout(function(){autoPlay(i);},400+orden.length*per+200);
}

// Vigila cambios de tamaño.
function watchFit(sc){
  if(!_RO||!sc)return;
  try{
    _RO.disconnect();
    var p=sc.querySelector(".fitwrap");
    if(p)_RO.observe(p);
  }catch(e){}
}

window.addEventListener("resize",function(){fitScene();});

// ============================================================
// TABLA DE CONTENIDOS
// ============================================================

function buildTOC(scene){
  var g=scene&&scene.querySelector("#tocGrid");
  if(!g)return;
}

// Actualiza visualmente las secciones completadas.
function refreshTOC(){}

// ============================================================
// MOSTRAR DIAPOSITIVA
// ============================================================

// Cambia la escena actual y ejecuta sus funciones propias.
function show(i){
  stopPlayback();
  idx=i;
  if(i>maxReached)maxReached=i;

  var s=SLIDES[i];
  var player=document.querySelector(".player"),transcript=document.getElementById("transcript");
  if(player)player.style.display=s.audio?"":"none";
  if(transcript)transcript.classList.remove("on");
  applyTheme(s.mod);

  scenes.forEach(function(sc,k){
    sc.classList.toggle("active",k===i);
  });

  wire(scenes[i],i);
  prepare(s.k,s.audio||"",null);
  if(!s.audio)tryComplete(i);

  var _LK=["pillars","qmaster","vmaster","acc","ayuda","scenario","hub"];

  scenes[i].classList.toggle(
    "introlock",
    RESTRICT&&_LK.indexOf(s.type)>=0&&!!s.audio&&!heard[s.k]&&audioUnlocked
  );

  if(s.reset)s.reset(scenes[i],i);

  if(s.type==="howto"){
    revealCycle(scenes[i],i);              // primero el ciclo, luego el audio
  }else if(s.type==="content"&&scenes[i].querySelector("[data-seq]")){
    revealSeq(scenes[i],i);                // primero las viñetas, luego el audio
  }else if(s.enter){
    s.enter(scenes[i],i);                  // por si alguna diapositiva especial lo necesita
  }else if(audioUnlocked&&s.audio){
    autoPlay(i);                           // sin animación: audio de inmediato
  }

  document.getElementById("sceneLabel").textContent="Escena "+(i+1)+" de "+SLIDES.length;

  refreshMenu();
  refreshNav();
  updateOverall();
  scenes[i].scrollTop=0;
  watchFit(scenes[i]);
  fitScene(scenes[i]);

  requestAnimationFrame(function(){fitScene(scenes[i]);});
  setTimeout(function(){if(idx===i)fitScene(scenes[i]);},400);
  setTimeout(function(){if(idx===i)fitScene(scenes[i]);},1200);
}

// Actualiza los botones de navegación.
function refreshNav(){
  var prev=document.getElementById("prevBtn");
  var next=document.getElementById("nextBtn");
  var pi=prevIndex(idx);

  prev.disabled=(pi<0||idx===0);

  var ready=isReady(idx);
  var ni=nextIndex(idx);
  var last=(SLIDES[idx].type==="recursos");

  next.disabled=last||ni<0||!ready;
  next.style.visibility=last?"hidden":"visible";

  var hint=document.getElementById("hint");
  var ht=document.getElementById("hintTxt");

  if(!ready&&!last){
    ht.textContent="Escucha el audio completo para continuar";
    hint.classList.add("show");
  }else{
    hint.classList.remove("show");
  }

  if(SLIDES[idx].type==="cover"){
    next.innerHTML='Comenzar <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>';
  }else if(!last){
    next.innerHTML='Siguiente <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>';
  }
}

// ============================================================
// CONTROLES DE NAVEGACIÓN
// ============================================================

document.getElementById("nextBtn").addEventListener("click",function(){
  audioUnlocked=true;
  if(this.disabled)return;
  var ni=nextIndex(idx);
  if(ni>=0)show(ni);
});

document.getElementById("prevBtn").addEventListener("click",function(){
  var pi=prevIndex(idx);
  if(pi>=0)show(pi);
});

document.addEventListener("keydown",function(e){
  if(e.target.closest("input,textarea"))return;
  var n=document.getElementById("nextBtn");
  var p=document.getElementById("prevBtn");

  if(e.key==="ArrowRight"&&!n.disabled)n.click();
  if(e.key==="ArrowLeft"&&!p.disabled)p.click();

  if(e.key===" "){
    e.preventDefault();
    play();
  }
});

// ============================================================
// INICIALIZACIÓN
// ============================================================

buildMenu();
show(0);

</script>
